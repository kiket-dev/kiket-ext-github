name: "GitHub Integration Overview"
description: "Overview of GitHub repositories, pull requests, and sync status"
refresh_interval: 300  # 5 minutes

sections:
  - name: "Summary Metrics"
    layout: "grid"
    columns: 4
    widgets:
      - type: "metric"
        title: "Connected Repositories"
        query: "SELECT COUNT(*) as value FROM github_data.repositories WHERE sync_enabled = true"
        icon: "git-branch"

      - type: "metric"
        title: "Open Pull Requests"
        query: "SELECT COUNT(*) as value FROM github_data.pull_requests WHERE state = 'open'"
        icon: "git-pull-request"

      - type: "metric"
        title: "Mapped Issues"
        query: "SELECT COUNT(*) as value FROM github_data.issue_mappings"
        icon: "link"

      - type: "metric"
        title: "Avg Merge Time"
        query: "SELECT ROUND(AVG(avg_merge_time_hours), 1) || ' hrs' as value FROM repository_summary WHERE avg_merge_time_hours IS NOT NULL"
        icon: "clock"

  - name: "Pull Request Trends"
    layout: "full-width"
    widgets:
      - type: "line-chart"
        title: "Daily PR Activity"
        query: |
          SELECT
            metric_date as date,
            SUM(prs_opened) as "Opened",
            SUM(prs_merged) as "Merged",
            SUM(prs_closed_unmerged) as "Closed"
          FROM pr_metrics_daily
          WHERE metric_date >= CURRENT_DATE - INTERVAL '30 days'
          GROUP BY metric_date
          ORDER BY metric_date
        x_axis: "date"
        y_axis: ["Opened", "Merged", "Closed"]

  - name: "Repository Performance"
    layout: "half-width"
    widgets:
      - type: "bar-chart"
        title: "Top Repositories by PR Volume"
        query: |
          SELECT
            repository as name,
            total_prs as value
          FROM repository_summary
          ORDER BY total_prs DESC
          LIMIT 10
        orientation: "horizontal"

      - type: "bar-chart"
        title: "Merge Rate by Repository"
        query: |
          SELECT
            repository as name,
            merge_rate_pct as value
          FROM repository_summary
          WHERE total_prs > 0
          ORDER BY merge_rate_pct DESC
          LIMIT 10
        orientation: "horizontal"
        unit: "%"

  - name: "Webhook Reliability"
    layout: "full-width"
    widgets:
      - type: "table"
        title: "Recent Webhook Deliveries"
        query: |
          SELECT
            delivery_date as "Date",
            event_type as "Event Type",
            total_deliveries as "Total",
            successful_deliveries as "Success",
            failed_deliveries as "Failed",
            success_rate_pct as "Success Rate %"
          FROM webhook_reliability
          WHERE delivery_date >= CURRENT_DATE - INTERVAL '7 days'
          ORDER BY delivery_date DESC, event_type
        page_size: 20

  - name: "Active Pull Requests"
    layout: "full-width"
    widgets:
      - type: "table"
        title: "Open PRs Awaiting Review"
        query: |
          SELECT
            r.full_name as "Repository",
            pr.pr_number as "PR#",
            pr.title as "Title",
            pr.author as "Author",
            pr.reviews_count as "Reviews",
            pr.approved_reviews as "Approved",
            pr.checks_status as "Checks",
            DATE_PART('day', NOW() - pr.pr_created_at) || 'd' as "Age"
          FROM github_data.pull_requests pr
          JOIN github_data.repositories r ON pr.repository_id = r.id
          WHERE pr.state = 'open'
          ORDER BY pr.pr_created_at ASC
          LIMIT 50
        page_size: 20

filters:
  - name: "repository"
    label: "Repository"
    type: "select"
    query: "SELECT DISTINCT full_name as value, full_name as label FROM github_data.repositories ORDER BY full_name"

  - name: "date_range"
    label: "Date Range"
    type: "date-range"
    default: "last_30_days"

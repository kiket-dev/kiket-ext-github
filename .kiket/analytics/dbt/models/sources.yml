version: 2

sources:
  - name: github_data
    description: "GitHub extension custom data tables"
    tables:
      - name: repositories
        description: "Registered GitHub repositories"
      - name: pull_requests
        description: "Synchronized pull requests"
      - name: issue_mappings
        description: "GitHub-Kiket issue mappings"
      - name: webhook_deliveries
        description: "GitHub webhook delivery log"
      - name: sync_jobs
        description: "Repository sync job history"

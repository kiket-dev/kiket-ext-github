title: Require PR Review Before Deploy
description: Block deployment transitions until PR is approved

automations:
  - name: require_pr_approval
    trigger:
      event: workflow.before_transition
      conditions:
        - field: transition.to
          operator: eq
          value: "deployed"
    guards:
      - extension: dev.kiket.ext.github
        check: pr_approved
        params:
          require_reviews: 1
          dismiss_stale: true
        on_fail:
          action: deny
          message: "At least one approved PR review is required before deployment"

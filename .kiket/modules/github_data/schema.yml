module: github_data
version: "1.0"
description: "GitHub integration data storage for repositories, PRs, issues, and sync state"

tables:
  repositories:
    columns:
      - name: id
        type: bigint
        primary_key: true
        auto_increment: true
      - name: owner
        type: string
        length: 255
        null: false
      - name: name
        type: string
        length: 255
        null: false
      - name: full_name
        type: string
        length: 512
        null: false
        unique: true
      - name: installation_id
        type: bigint
        null: true
      - name: kiket_project_id
        type: string
        null: false
      - name: sync_enabled
        type: boolean
        default: true
      - name: sync_issues
        type: boolean
        default: true
      - name: sync_prs
        type: boolean
        default: true
      - name: auto_link
        type: boolean
        default: true
      - name: default_branch
        type: string
        default: "main"
      - name: registered_at
        type: timestamp
        null: false
      - name: last_synced_at
        type: timestamp
        null: true
      - name: created_at
        type: timestamp
        null: false
      - name: updated_at
        type: timestamp
        null: false
    indexes:
      - name: idx_github_repos_project
        columns: [kiket_project_id]
      - name: idx_github_repos_full_name
        columns: [full_name]
        unique: true
      - name: idx_github_repos_sync_enabled
        columns: [sync_enabled]

  pull_requests:
    columns:
      - name: id
        type: bigint
        primary_key: true
        auto_increment: true
      - name: repository_id
        type: bigint
        null: false
      - name: pr_number
        type: integer
        null: false
      - name: title
        type: text
        null: false
      - name: state
        type: string
        length: 50
        null: false
      - name: html_url
        type: string
        length: 512
      - name: author
        type: string
        length: 255
      - name: base_branch
        type: string
        length: 255
      - name: head_branch
        type: string
        length: 255
      - name: mergeable
        type: boolean
        null: true
      - name: merged
        type: boolean
        default: false
      - name: draft
        type: boolean
        default: false
      - name: reviews_count
        type: integer
        default: 0
      - name: approved_reviews
        type: integer
        default: 0
      - name: changes_requested
        type: integer
        default: 0
      - name: checks_status
        type: string
        length: 50
        null: true
      - name: pr_created_at
        type: timestamp
        null: true
      - name: pr_updated_at
        type: timestamp
        null: true
      - name: merged_at
        type: timestamp
        null: true
      - name: synced_at
        type: timestamp
        null: false
      - name: kiket_issue_id
        type: string
        null: true
      - name: created_at
        type: timestamp
        null: false
      - name: updated_at
        type: timestamp
        null: false
    indexes:
      - name: idx_github_prs_repo
        columns: [repository_id, pr_number]
        unique: true
      - name: idx_github_prs_state
        columns: [state]
      - name: idx_github_prs_kiket_issue
        columns: [kiket_issue_id]
      - name: idx_github_prs_merged
        columns: [merged]
      - name: idx_github_prs_created
        columns: [pr_created_at]

  issue_mappings:
    columns:
      - name: id
        type: bigint
        primary_key: true
        auto_increment: true
      - name: repository_id
        type: bigint
        null: false
      - name: github_issue_number
        type: integer
        null: false
      - name: kiket_issue_id
        type: string
        null: false
      - name: direction
        type: string
        length: 50
        null: false
      - name: sync_comments
        type: boolean
        default: true
      - name: sync_status
        type: boolean
        default: true
      - name: sync_assignees
        type: boolean
        default: true
      - name: sync_labels
        type: boolean
        default: true
      - name: last_synced_at
        type: timestamp
        null: false
      - name: created_at
        type: timestamp
        null: false
      - name: updated_at
        type: timestamp
        null: false
    indexes:
      - name: idx_github_issue_mapping
        columns: [repository_id, github_issue_number]
        unique: true
      - name: idx_github_kiket_issue
        columns: [kiket_issue_id]
      - name: idx_github_direction
        columns: [direction]

  webhook_deliveries:
    columns:
      - name: id
        type: string
        primary_key: true
      - name: event_type
        type: string
        length: 100
        null: false
      - name: repository_id
        type: bigint
        null: true
      - name: received_at
        type: timestamp
        null: false
      - name: processed
        type: boolean
        default: false
      - name: error
        type: text
        null: true
      - name: payload
        type: json
        null: true
      - name: created_at
        type: timestamp
        null: false
    indexes:
      - name: idx_github_webhooks_event
        columns: [event_type]
      - name: idx_github_webhooks_received
        columns: [received_at]
      - name: idx_github_webhooks_processed
        columns: [processed]

  sync_jobs:
    columns:
      - name: id
        type: bigint
        primary_key: true
        auto_increment: true
      - name: repository_id
        type: bigint
        null: false
      - name: sync_type
        type: string
        length: 50
        null: false
      - name: status
        type: string
        length: 50
        null: false
      - name: items_processed
        type: integer
        default: 0
      - name: items_total
        type: integer
        null: true
      - name: started_at
        type: timestamp
        null: true
      - name: completed_at
        type: timestamp
        null: true
      - name: error
        type: text
        null: true
      - name: created_at
        type: timestamp
        null: false
      - name: updated_at
        type: timestamp
        null: false
    indexes:
      - name: idx_github_sync_repo
        columns: [repository_id]
      - name: idx_github_sync_status
        columns: [status]
      - name: idx_github_sync_created
        columns: [created_at]

permissions:
  - role: user
    tables:
      repositories:
        - read
      pull_requests:
        - read
      issue_mappings:
        - read
      webhook_deliveries:
        - read
      sync_jobs:
        - read
    conditions:
      - "kiket_project_id IN (user.accessible_projects)"

  - role: manager
    tables:
      repositories:
        - read
        - write
      pull_requests:
        - read
        - write
      issue_mappings:
        - read
        - write
        - delete
      webhook_deliveries:
        - read
      sync_jobs:
        - read
        - write
    conditions:
      - "kiket_project_id IN (user.managed_projects)"

  - role: admin
    tables:
      repositories:
        - read
        - write
        - delete
      pull_requests:
        - read
        - write
        - delete
      issue_mappings:
        - read
        - write
        - delete
      webhook_deliveries:
        - read
        - delete
      sync_jobs:
        - read
        - write
        - delete

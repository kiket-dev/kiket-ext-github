title: Auto-Transition on PR Merge
description: Automatically move issues to Done when their linked PRs are merged

automations:
  - name: close_issue_on_pr_merge
    trigger:
      event: github.pull_request.merged
    conditions:
      - field: pull_request.linked_issues
        operator: not_empty
    actions:
      - type: transition
        to: done
        for_each: pull_request.linked_issues
        comment: |
          Closed via PR [#{{ pull_request.number }}]({{ pull_request.url }})
          Merged by: {{ pull_request.merged_by.login }}
